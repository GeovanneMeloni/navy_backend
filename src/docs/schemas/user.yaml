components:
  schemas:
    UserEmployeeRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
        phone:
          type: string
        rg:
          type: string
        cpf:
          type: string
        gender:
          type: string
          enum: [masculino, feminino, outro]
        cep:
          type: string
        rua:
          type: string
        numero:
          type: string
        logradouro:
          type: string
        estado:
          type: string
        municipio:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        role:
          type: string
          enum: [admin, employee, client]
        userType:
          type: string
          enum: ["individual", "company", "navy"]
      required:
        - email
        - password
        - role

