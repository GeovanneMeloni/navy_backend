components:
  schemas:
    CarInput:
      type: object
      properties:
        license_plate:
          type: string
        model:
          type: string
        brand:
          type: string
        year:
          type: integer
        color:
          type: string
        group:
          type: string
        fuel_type:
          type: string
        transmission:
          type: string
        mileage:
          type: number
        operationType:
          type: string
          enum: [sale, rent]
        price:
          type: number
        price_per_hour:
          type: number
        owner_id:
          description: "Proprietário do carro, se não definido, irá ser trazer o ID do usuário logado"
          type: string
        cep:
          type: string
        rua:
          type: string
        numero:
          type: string
        logradouro:
          type: string
        estado:
          type: string
        municipio:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        photo:
          type: string
          format: binary
      required:
        - license_plate
        - model
        - brand
        - year
        - color

    CarInputJson:
      type: object
      properties:
        license_plate:
          type: string
        model:
          type: string
        brand:
          type: string
        year:
          type: integer
        color:
          type: string
        group:
          type: string
        fuel_type:
          type: string
        transmission:
          type: string
        mileage:
          type: number
        operationType:
          type: string
          enum: [sale, rent]
        price:
          type: number
        price_per_hour:
          type: number
        owner_id:
          description: "Proprietário do carro, se não definido, irá ser trazer o ID do usuário logado"
          type: string
        cep:
          type: string
        rua:
          type: string
        numero:
          type: string
        logradouro:
          type: string
        estado:
          type: string
        municipio:
          type: string
        latitude:
          type: number
        longitude:
          type: number
      required:
        - license_plate
        - model
        - brand
        - year
        - color

    CarUpdateInput:
      type: object
      properties:
        license_plate:
          type: string
        model:
          type: string
        brand:
          type: string
        year:
          type: integer
        color:
          type: string
        group:
          type: string
        fuel_type:
          type: string
        transmission:
          type: string
        mileage:
          type: number
        price:
          type: number
        price_per_hour:
          type: number
        owner_id:
          type: string
        cep:
          type: string
        rua:
          type: string
        numero:
          type: string
        logradouro:
          type: string
        estado:
          type: string
        municipio:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        photo:
          type: string
          format: binary
      # Nenhum campo é obrigatório para update

    CarUpdateInputJson:
      type: object
      properties:
        license_plate:
          type: string
        model:
          type: string
        brand:
          type: string
        year:
          type: integer
        color:
          type: string
        group:
          type: string
        fuel_type:
          type: string
        transmission:
          type: string
        mileage:
          type: number
        price:
          type: number
        price_per_hour:
          type: number
        owner_id:
          type: string
        cep:
          type: string
        rua:
          type: string
        numero:
          type: string
        logradouro:
          type: string
        estado:
          type: string
        municipio:
          type: string
        latitude:
          type: number
        longitude:
          type: number

    CarResponse:
      type: object
      properties:
        _id:
          type: string
          example: "685600c02a357ad2c0adf4a1"
        operationType:
          type: string
          enum: [rent, sale]
        price_per_hour:
          type: number
          example: 95
        license_plate:
          type: string
          example: "DEXKYJG"
        status:
          type: string
          enum: [available, rented, sold]
        rented_at:
          type: string
          format: date-time
          nullable: true
        sold_at:
          type: string
          format: date-time
          nullable: true
        rented_by:
          type: string
        sold_to:
          type: string
        short_description:
          type: string
          example: "PORSCHE 1 34.805 km 2015 SEMI-AUTOMÁTICO"
        mileage:
          type: number
          example: 34805
        address:
          $ref: "#/components/schemas/Address"
        owner_id:
          type: string
          example: "685600c02a357ad2c0adf49d"
        model:
          type: string
          example: "1"
        brand:
          type: string
          example: "Porsche"
        year:
          type: integer
          example: 2015
        color:
          type: string
          example: "escarlate"
        fuel_type:
          type: string
          example: "diesel"
        transmission:
          type: string
          example: "semi-automático"

    CarListResponse:
      type: array
      items:
        $ref: "#/components/schemas/CarResponse"
