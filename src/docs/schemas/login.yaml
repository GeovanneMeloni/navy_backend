components:
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          example: "admin@navy.com"
        password:
          type: string
          example: "123456"
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: "Usuário autenticado com sucesso"
        tokenJWT:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
        user:
          type: object
          properties:
            id:
              type: string
              example: "1234567890abcdef"
            name:
              type: string
              example: "John Doe"
